<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SPS Lager">
  <meta name="description" content="Lokale Lagerverwaltung für SPS-Produkte">
  <link rel="manifest" href="./manifest-v08.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style-v08.css?v=80">
  <title>SPS Lager</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="kicker">Lokale Inventarverwaltung</div>
      <h1>SPS Lager</h1>
    </div>
    <button id="settingsBtn" class="settings-button" type="button" aria-label="Einstellungen">⚙</button>
  </header>

  <main>
    <section id="homeView" class="view active">
      <article class="summary-card">
        <div>
          <span>Gesamtbestand</span>
          <strong id="totalStock">0</strong>
          <small id="productCount">0 Produkte</small>
        </div>
        <div class="summary-mark">X20</div>
      </article>

      <div class="section-head">
        <div>
          <span>Produkte</span>
          <h2>Produkt auswählen</h2>
        </div>
      </div>

      <input id="searchInput" class="search-input" type="search" placeholder="Produkt suchen …">
      <div id="productGrid" class="product-grid"></div>
    </section>

    <section id="stockView" class="view">
      <div class="page-head">
        <button class="back-button" data-home type="button">‹</button>
        <div>
          <span>Bestand buchen</span>
          <h2 id="stockProductName">Produkt</h2>
        </div>
      </div>

      <article class="stock-card">
        <span>Aktueller Bestand</span>
        <strong id="currentStock">0</strong>
        <small>Stück</small>
      </article>

      <article class="panel">
        <div class="mode-switch">
          <button id="bookInMode" class="active" type="button">Einbuchen</button>
          <button id="bookOutMode" type="button">Ausbuchen</button>
        </div>

        <label class="field-label">
          Menge
          <input id="quantityInput" type="number" inputmode="numeric" min="1" step="1" value="1">
        </label>

        <div class="quick-grid">
          <button type="button" data-qty="1">1</button>
          <button type="button" data-qty="5">5</button>
          <button type="button" data-qty="10">10</button>
          <button type="button" data-qty="25">25</button>
          <button type="button" data-qty="50">50</button>
          <button type="button" data-qty="100">100</button>
        </div>

        <button id="applyStockBtn" class="primary-button" type="button">1 Stück einbuchen</button>
      </article>
    </section>

    <section id="settingsView" class="view">
      <div class="page-head">
        <button class="back-button" data-home type="button">‹</button>
        <div>
          <span>Verwaltung</span>
          <h2>Einstellungen</h2>
        </div>
      </div>

      <button id="newProductBtn" class="wide-action" type="button">
        <span class="wide-icon">＋</span>
        <span><strong>Neues Produkt hinzufügen</strong><small>Produktname und Anfangsbestand erfassen</small></span>
        <b>›</b>
      </button>

      <article class="panel settings-panel">
        <h3>Produkte verwalten</h3>
        <div id="settingsProductList" class="settings-product-list"></div>
      </article>

      <article class="panel">
        <h3>Daten</h3>
        <div class="export-grid">
          <button id="csvBtn" type="button">CSV</button>
          <button id="xlsBtn" type="button">Excel</button>
          <button id="pdfBtn" type="button">PDF</button>
          <button id="backupBtn" type="button">Backup</button>
        </div>
        <label class="restore-label">
          Backup wiederherstellen
          <input id="restoreInput" type="file" accept=".json,application/json">
        </label>
      </article>
    </section>

    <section id="productFormView" class="view">
      <div class="page-head">
        <button class="back-button" id="backToSettings" type="button">‹</button>
        <div>
          <span id="formKicker">Neues Produkt</span>
          <h2 id="formTitle">Produkt anlegen</h2>
        </div>
      </div>

      <article class="panel">
        <label class="field-label">
          Produktname
          <input id="productNameInput" type="text" autocomplete="off" autocapitalize="characters" placeholder="z. B. X20BT9400">
        </label>

        <label id="initialStockWrap" class="field-label">
          Anfangsbestand
          <input id="initialStockInput" type="number" inputmode="numeric" min="0" step="1" value="0">
        </label>

        <button id="saveProductBtn" class="primary-button" type="button">Produkt speichern</button>
        <button id="deleteProductBtn" class="danger-button hidden" type="button">Produkt löschen</button>
      </article>
    </section>
  </main>

  <div id="toast" class="toast"></div>
</div>

<script src="./app-v08.js?v=80"></script>
</body>
</html>
